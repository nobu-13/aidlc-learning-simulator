<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      best-effort meta CSP（GitHub Pages 等 header 制御不可時のフォールバック）。
      CSP の source of truth は CloudFront Response Headers Policy（infrastructure-specification）。
      no-network posture: application data/user input を外部送信しない（connect-src 'self'）。

      RC6 記録（P3）: frame-ancestors は仕様上 HTTP レスポンスヘッダでのみ有効で、
      <meta http-equiv> 経由では多くのブラウザが無視する。ここに残しているのは意図の記録であり、
      実効的な clickjacking 防御は Preview/配信インフラ側（CloudFront Response Headers Policy /
      GitHub Pages では別途）で frame-ancestors（または X-Frame-Options）ヘッダを設定する必要がある。
      アプリ側コードだけでは完結しないため、RC6 ではこの制約を記録に留める（コード変更なし）。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
    />
    <title>AI-DLC Learning Simulator</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
